<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자소서 불러오기 | TTS Cover Letter</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="history">
  <header class="site-header">
    <a class="brand" href="/">TTS Cover Letter</a>
    <nav class="site-nav" aria-label="primary">
      <a href="/pages/cover-letter.html">자기소개서 생성</a>
      <a href="/pages/interview.html">면접 보기</a>
      <a href="/pages/history.html" aria-current="page">자소서 불러오기</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-hero">
      <div>
        <p class="eyebrow">Cover Letter Library</p>
        <h1>저장된 자소서와 면접 대비 내용을 불러옵니다.</h1>
        <p id="history-summary" class="lead">직무별 자소서 샘플과 생성된 면접 질문을 확인하는 중입니다.</p>
      </div>
      <div class="page-actions">
        <a class="ghost-button" href="/pages/interview.html">면접 보기</a>
        <button id="refresh-history" class="ghost-button" type="button">새로고침</button>
      </div>
    </section>

    <section class="history-workspace">
      <article class="page-panel">
        <p class="card-label">자소서 목록</p>
        <div id="history-list" class="history-list">
          <div class="empty-state">자소서를 불러오는 중입니다.</div>
        </div>
        <div id="history-pagination" class="pagination-row" aria-label="자소서 목록 페이지"></div>
      </article>

      <aside class="page-panel history-detail" id="history-detail">
        <p class="card-label">자소서 상세</p>
        <div class="empty-state">왼쪽 샘플을 클릭하면 자소서와 관련 면접 질문을 확인할 수 있습니다.</div>
      </aside>
    </section>
  </main>
</body>
</html>
