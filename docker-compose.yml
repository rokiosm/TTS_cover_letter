services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cover_letter_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d cover_letter_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-server:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag_password@postgres:5432/cover_letter_rag
    volumes:
      - ./linkareer_1to740.csv:/app/linkareer_1to740.csv:ro
      - ./categories:/app/categories:ro
      - ./Embedding:/app/Embedding
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
