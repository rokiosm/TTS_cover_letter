<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Category Visualizations</title>
  <style>
    body { margin: 24px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color: #222; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #666; }
    .chart { margin: 28px 0 40px; }
    .chart h2 { font-size: 18px; margin-bottom: 10px; }
    img { max-width: 100%; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Category Visualizations</h1>

  <section class="chart">

<img src="job_confidence.svg" alt="job confidence">
</section><section class="chart">

</section><section class="chart">
<h2>spec intern presence</h2>
<img src="spec_intern_presence.svg" alt="spec intern presence">
</section><section class="chart">

<h2>spec major group</h2>
<img src="spec_major_group.svg" alt="spec major group">
</section><section class="chart">
<h2>spec other certificate presence</h2>
<img src="spec_other_certificate_presence.svg" alt="spec other certificate presence">
</section><section class="chart">
<h2>spec other presence</h2>
<img src="spec_other_presence.svg" alt="spec other presence">

<img src="spec_school_category.svg" alt="spec school category">
</section>

</html>
